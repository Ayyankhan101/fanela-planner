# UNUSED — kept for reference only. Homebrew PostgreSQL 18.4 is the source of
# truth for local dev (see README.md). Drift tracked in TODOS.md (dev-DB drift).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fanela
      POSTGRES_PASSWORD: fanela_dev
      POSTGRES_DB: fanela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanela -d fanela"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
