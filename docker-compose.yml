services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fanela
      POSTGRES_PASSWORD: fanela_dev
      POSTGRES_DB: fanela
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanela -d fanela"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
